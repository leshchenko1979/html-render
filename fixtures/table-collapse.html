<div style="width:400px">
  <table style="border-collapse:collapse;border-spacing:0;table-layout:fixed;width:400px">
    <colgroup><col style="width:120px"><col style="width:80px"><col style="width:200px"></colgroup>
    <tbody>
      <tr>
        <td style="height:20px;padding:0;background-color:#ff0000;border:2px solid #000000"></td>
        <td style="padding:4px;background-color:#00ff00;border:1px solid #000000"></td>
        <td rowspan="2" style="padding:0;background-color:#0000ff;border:3px solid #000000"></td>
      </tr>
      <tr>
        <td colspan="2" style="height:30px;padding:0;background-color:#ffff00;border:2px solid #000000"></td>
      </tr>
      <tr>
        <td style="height:16px;padding:6px;background-color:#ff00ff;border:0"></td>
        <td style="padding:0;background-color:#00ffff;border:4px solid #000000"></td>
        <td style="padding:0;background-color:#808080;border:1px dashed #000000"></td>
      </tr>
    </tbody>
  </table>
  <table style="border-collapse:separate;border-spacing:6px 4px;width:200px">
    <tbody>
      <tr>
        <td style="height:12px;padding:0;background-color:#400000;border:1px solid #000000"></td>
        <td style="padding:0;background-color:#004000;border:1px solid #000000"></td>
      </tr>
    </tbody>
  </table>
</div>
