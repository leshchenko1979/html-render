name: parity

# Measures Blitz's CSS geometry against Chromium on the parity corpus in
# fixtures/: both engines render each fixture and one instrument reads both PNGs.
#
# The box this spike was written on runs `cargo` as a shim that refuses to
# compile (host policy), so the build lives here. Everything the job measures is
# reproducible: pinned Blitz crates, pinned fixtures, one instrument for both
# engines, and the numbers land as an artifact.

on:
  push:
    branches: ["**"]
    # A Rust build is not free, and this job only measures the renderer: a README
    # or licence edit used to buy two full builds. Anything that can move a
    # pixel, a fixture or the instrument is listed; docs are not.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # No build.rs exists; listing it made the trigger look broader than it was.
      - "assets/**"
      - "fixtures/**"
      - "tools/**"
      # Every workflow, not just this one: a Dependabot action bump edits the
      # OTHER files, and a bump that merges untested is how all eight pins sat
      # three majors behind. A workflow edit is cheap to re-verify and cannot
      # move a pixel, so the run is the proof the job still starts.
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

# A superseded push must stop paying for a build nobody will read: on 11-05 ten
# runs stacked up in 2h10m and not one was cancelled. Per-ref, so a branch push
# never kills a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    # NOT ubuntu-latest: the runner image's glibc becomes the binary's floor,
    # and a moving image silently raises it. Pinning to 22.04 keeps the floor at
    # glibc 2.35, which runs on 22.04, 24.04 and every host we own. The guard
    # below fails the build if anything drags the floor back up.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install system dependencies
        # Blitz's font stack links fontconfig; the runner image does not ship
        # the development headers.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build the Blitz renderer
        shell: bash
        # pipefail, so a failed build is not masked by the tail's exit status.
        run: |
          set -o pipefail
          # --locked: the committed Cargo.lock is the resolved graph every
          # number in GATES.md was measured on. Without this flag a
          # Cargo.toml that resolves differently re-resolves silently and
          # the build no longer matches the published figures.
          cargo build --release --locked 2>&1 | tail -60

      - name: Assert the glibc floor
        # The whole point of pinning the runner is portability, and a floor is
        # only real if something checks it. A symbol above 2.35 means the binary
        # will not start on hosts we own, so fail here rather than at runtime.
        run: |
          set -euo pipefail
          MAX=$(objdump -T target/release/render \
                | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "required glibc floor: $MAX"
          if [ "$(printf '%s\n2.35\n' "$MAX" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::binary requires glibc $MAX, above the 2.35 floor"
            exit 1
          fi
          echo "ok: runs on glibc >= 2.35"

      - name: Test the --clip contract
        # Regression for #1: `--clip … '*'` used to abort on the first `<br>`.
        # Cheap (no browser, ~1 s), and it runs against the binary this job just
        # built, so a regression fails here rather than on someone's deck.
        run: python3 tools/test_clip_void.py --bin target/release/render

      - name: Test the exit-code contract
        # The README documents 0/2/3/101, so every one is asserted here. An
        # unknown flag used to exit 0 and render anyway: a typo produced the
        # wrong picture with nothing on stderr.
        run: python3 tools/test_exit_codes.py --bin target/release/render

      - name: Test redirected sub-resources
        # Blitz reports the FINAL url after a redirect while the document keys
        # its waiting nodes on the REQUESTED one, so a redirected image used to
        # decode successfully and then be dropped: blank box, exit 0, nothing on
        # stderr. The direct-URL leg is the control that proves this harness can
        # paint at all; the 404 leg pins the other silent failure.
        run: python3 tools/test_redirect.py --bin target/release/render

      - name: Test the full-page escape hatch
        # Single-image mode paints exactly the viewport, so a taller document is
        # cut with exit 0 and nothing on stderr. Leg (a) pins that trap so a
        # future change to the default is visible; (b) and (c) prove `--full`
        # raises the canvas to the document and never shrinks it.
        run: python3 tools/test_full_page.py --bin target/release/render

      - name: Test document-root detection
        # A file that declares its own document root must be rendered verbatim.
        # Wrapping it hands the canvas to the wrapper's `html{background:#fff}`
        # reset, so a `body`-coloured page comes out white — identical geometry,
        # nothing on stderr. The legs that pin that fail against the r2 release
        # binary, which is why this runs against the freshly built one.
        run: python3 tools/test_document_detect.py --bin target/release/render

      - name: Test the CSS audit
        # `tools/css_audit.py` answers "which declarations did you drop?" by
        # removing one at a time and diffing the PNG. Its two controls are the
        # point: a declaration no engine honours must read inert, and a
        # load-bearing one must never. Without the second leg a tool that
        # called everything inert would pass the first and be worse than
        # useless.
        run: python3 tools/test_css_audit.py --bin target/release/render

      - name: Check the documented numbers
        # README, GATES and the release template quote ratios derived from a
        # handful of measurements. Those ratios rot silently: the source number
        # gets re-measured and the "2.49x" three paragraphs away keeps its old
        # value because nothing multiplies them again. This recomputes every
        # derived figure and fails on a mismatch. It also re-renders the two
        # committed asset PNGs and requires them byte-identical, so a renderer
        # change that alters the hero image cannot pass unnoticed.
        run: python3 tools/check_claims.py --bin target/release/render

      - name: Test the corpus gate
        # The gate's logic is a pure function, so it is tested here without a
        # browser — including six negative controls that each assert a real
        # defect makes it exit nonzero. A gate nobody can fail is decoration.
        run: python3 tools/test_parity_gate.py

      - name: Check for names that resolve to nothing
        # The corpus gate above printed PASS and then the job died on
        # `NameError: name 'result' is not defined` — a refactor removed the
        # variable and left the return. `py_compile` accepts that, so nothing in
        # the repo could have caught it. This walks every scope with symtable.
        run: python3 tools/test_undefined_names.py --self-test

      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            npx --yes playwright install --with-deps chromium
            echo "CHROME=$(find ~/.cache/ms-playwright -name chrome -type f | head -1)" >> "$GITHUB_ENV"
          fi

      - name: Measure the corpus
        # This is a GATE, not a report: tools/parity_baseline.json pins the four
        # known divergences by fixture:colour with their measured delta, and any
        # new or worsened one exits 1. It used to end at `return result`, so
        # four divergences passed every push and forty would have passed too.
        run: python3 tools/run_parity.py

      - name: Upload the built renderer
        # So the binary can be run on documents that must not be committed.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: html-render
          path: target/release/render
          if-no-files-found: error

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parity-results
          path: out/
          if-no-files-found: warn
