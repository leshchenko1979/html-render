name: parity

# Measures Blitz's CSS geometry against Chromium on the parity corpus in
# fixtures/: both engines render each fixture and one instrument reads both PNGs.
#
# The box this spike was written on runs `cargo` as a shim that refuses to
# compile (host policy), so the build lives here. Everything the job measures is
# reproducible: pinned Blitz crates, pinned fixtures, one instrument for both
# engines, and the numbers land as an artifact.

on:
  push:
    branches: ["**"]
    # A Rust build is not free, and this job only measures the renderer: a README
    # or licence edit used to buy two full builds. Anything that can move a
    # pixel, a fixture or the instrument is listed; docs are not.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "fixtures/**"
      - "tools/**"
      - ".github/workflows/parity.yml"
  workflow_dispatch:

# A superseded push must stop paying for a build nobody will read: on 11-05 ten
# runs stacked up in 2h10m and not one was cancelled. Per-ref, so a branch push
# never kills a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    # NOT ubuntu-latest: the runner image's glibc becomes the binary's floor,
    # and a moving image silently raises it. Pinning to 22.04 keeps the floor at
    # glibc 2.35, which runs on 22.04, 24.04 and every host we own. The guard
    # below fails the build if anything drags the floor back up.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # Blitz's font stack links fontconfig; the runner image does not ship
        # the development headers.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build the Blitz renderer
        shell: bash
        # pipefail, so a failed build is not masked by the tail's exit status.
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tail -60

      - name: Assert the glibc floor
        # The whole point of pinning the runner is portability, and a floor is
        # only real if something checks it. A symbol above 2.35 means the binary
        # will not start on hosts we own, so fail here rather than at runtime.
        run: |
          set -euo pipefail
          MAX=$(objdump -T target/release/render \
                | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "required glibc floor: $MAX"
          if [ "$(printf '%s\n2.35\n' "$MAX" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::binary requires glibc $MAX, above the 2.35 floor"
            exit 1
          fi
          echo "ok: runs on glibc >= 2.35"

      - name: Test the --clip contract
        # Regression for #1: `--clip … '*'` used to abort on the first `<br>`.
        # Cheap (no browser, ~1 s), and it runs against the binary this job just
        # built, so a regression fails here rather than on someone's deck.
        run: python3 tools/test_clip_void.py --bin target/release/render

      - name: Test the exit-code contract
        # The README documents 0/2/3/101, so every one is asserted here. An
        # unknown flag used to exit 0 and render anyway: a typo produced the
        # wrong picture with nothing on stderr.
        run: python3 tools/test_exit_codes.py --bin target/release/render

      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            npx --yes playwright install --with-deps chromium
            echo "CHROME=$(find ~/.cache/ms-playwright -name chrome -type f | head -1)" >> "$GITHUB_ENV"
          fi

      - name: Measure
        run: python3 tools/run_parity.py

      - name: Upload the built renderer
        # So the binary can be run on documents that must not be committed.
        uses: actions/upload-artifact@v7
        with:
          name: html-render
          path: target/release/render
          if-no-files-found: error

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-results
          path: out/
          if-no-files-found: warn
