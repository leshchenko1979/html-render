name: drain-probe

# Isolates which part of the drain loop makes sub-resource images arrive.
#
# The renderer's drain loop was changed to "four consecutive empty polls + yield
# + 2 ms sleep" because the loop copied from Blitz's own example
# (examples/screenshot.rs) rendered documents with missing images. The reason
# written down at the time — that Provider::is_empty() is racy — does not hold:
# the waker is cloned in NetProvider::fetch BEFORE spawn, so is_empty() flips as
# soon as a fetch is queued. Something else is going on, and this job measures
# what, on one binary, with the loop shape selected by BLITZ_DRAIN.
#
# Each mode is run repeatedly: a timing bug is a distribution, not one sample.

on:
  # Dispatch-only. This job asks ONE question ("which part of the drain loop makes
  # sub-resource images arrive?") and pays a 60-minute-timeout build per run to
  # answer it. Fired on every push to every branch it cost a full build for every
  # docs commit — first seen 11-05 08:02 and never narrowed since. `parity` builds
  # the same tree and covers the shipped loop; re-run this by hand when the drain
  # question reopens.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build the Blitz renderer
        shell: bash
        run: |
          set -o pipefail
          # --locked: the committed Cargo.lock is the resolved graph every
          # number in GATES.md was measured on. Without this flag a
          # Cargo.toml that resolves differently re-resolves silently and
          # the build no longer matches the published figures.
          cargo build --release --locked 2>&1 | tail -40

      - name: Run the drain probe
        run: python3 tools/drain_probe.py --bin target/release/render --runs 8 --show-trace

      - name: Upload the built renderer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: html-render-drain
          path: target/release/render
          if-no-files-found: error

      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drain-probe
          path: out/drain_probe.json
          if-no-files-found: warn
