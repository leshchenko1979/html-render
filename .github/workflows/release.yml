name: release

# Publishes the Blitz renderer as a GitHub Release asset, so the deck pipeline
# installs from a versioned URL with a checksum instead of a CI artifact that
# expires and cannot be verified by anyone else.
#
#   curl -fsSL -O https://github.com/leshchenko1979/html-render/releases/download/vX/html-render_X_linux_amd64.tar.gz
#
# Triggered by a version tag only: the artifact is a binary, and a binary that
# silently changes under a fixed URL is not pinnable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist; the build is taken from this tag)"
        required: true

# Serialised, NOT cancelled: a publish half-way through replacing an asset is
# worse than waiting for the one ahead of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create
  # Sigstore keyless signing: the workflow's own OIDC identity is the signer, so
  # there is no private key to leak, rotate or lose. `attestations: write` is
  # where the provenance record lands; it is public and tied to the digest.
  id-token: write
  attestations: write

jobs:
  release:
    # NOT ubuntu-latest: the runner image's glibc becomes the binary's floor.
    # Pinning to 22.04 keeps it at 2.35; the guard below fails the build if
    # anything drags it back up.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # A dispatch names a tag, and the asset must be built from THAT tag's
          # source: building the dispatched ref while `--verify-tag` merely checks
          # the tag exists publishes a binary that does not match its own tag.
          # On a tag push `github.ref` is already the tag, so this is a no-op.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Assert the tag matches Cargo.toml
        # V1, measured: `v0.3.0-beta.4-r1` shipped a binary reporting `0.1.0`
        # because the version came from the tag and nothing compared it to the
        # manifest. Cargo.toml is the single source of truth; the tag is derived.
        # Placed before the build so a mismatch costs seconds, not eight minutes.
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          [ -n "$TAG" ] || { echo "::error::no tag"; exit 1; }
          MANIFEST=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          echo "tag: $TAG   manifest: $MANIFEST"
          if [ "v$MANIFEST" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $MANIFEST"
            exit 1
          fi
          echo "ok: tag and manifest agree"

      - name: Build the Blitz renderer
        shell: bash
        run: |
          set -o pipefail
          # --locked: the committed Cargo.lock is the resolved graph every
          # number in GATES.md was measured on. Without this flag a
          # Cargo.toml that resolves differently re-resolves silently and
          # the build no longer matches the published figures.
          cargo build --release --locked 2>&1 | tail -60

      - name: Assert the glibc floor
        # A floor is only real if something checks it. A symbol above 2.35 means
        # the binary will not start on hosts we own, so fail here, not at runtime
        # on the box that needs it.
        run: |
          set -euo pipefail
          MAX=$(objdump -T target/release/render \
                | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "required glibc floor: $MAX"
          if [ "$(printf '%s\n2.35\n' "$MAX" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::binary requires glibc $MAX, above the 2.35 floor"
            exit 1
          fi
          echo "ok: runs on glibc >= 2.35"

      - name: Assert the built binary reports the tag
        # V1 one layer down: the manifest can be right while the built artefact is
        # stale (a cached target/, a wrong [[bin]]). Read the binary, not the source.
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          REPORTED=$(./target/release/render --version | head -1 | awk '{print $NF}')
          echo "tag: $TAG   binary reports: $REPORTED"
          if [ "$REPORTED" != "${TAG#v}" ]; then
            echo "::error::binary reports $REPORTED but the tag is $TAG"
            exit 1
          fi
          echo "ok: binary matches the tag"

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          [ -n "$VERSION" ] || { echo "::error::no tag"; exit 1; }
          NAME="html-render_${VERSION#v}_linux_amd64"
          mkdir -p dist
          cp target/release/render dist/html-render
          chmod 755 dist/html-render
          tar -C dist -czf "dist/${NAME}.tar.gz" html-render
          # The tarball is what gets downloaded, so the checksum is of the tarball.
          ( cd dist && sha256sum "${NAME}.tar.gz" > checksums.txt )
          cat dist/checksums.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Read from the artefact rather than typed into the body: a hardcoded
          # size goes stale on the first dependency bump and nobody notices.
          echo "size=$(du -h dist/html-render | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest the release artefacts
        # Signed by the workflow's OIDC identity, not by a key in a secret: the
        # provenance says which repo, commit and workflow produced these bytes,
        # and `gh attestation verify` checks that chain against GitHub's own
        # issuer. A checksum published beside the file by the same job proves the
        # download was not corrupted; this proves who made it.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          NAME='${{ steps.pkg.outputs.name }}'
          SIZE='${{ steps.pkg.outputs.size }}'
          NOTES=$(cat <<EOF
          Blitz-based renderer CLI, built from \`${{ github.sha }}\`.

          Dynamically linked, not static: the table below lists every shared
          library it needs, and \`ldd\` on the asset prints the same list.

          | | |
          |---|---|
          | Asset | \`${NAME}.tar.gz\` |
          | Binary | \`html-render\`, ${SIZE}, single file |
          | Runtime deps | 13 system libraries: glibc, libssl/libcrypto, freetype, fontconfig, expat, png, zlib, bz2, brotli |
          | glibc floor | 2.35 (asserted at build time) |
          | Built on | ubuntu-22.04 |
          | Blitz pin | see \`Cargo.toml\` at this tag |

          Install:

          \`\`\`bash
          V=${VERSION}
          curl -fsSL -O "https://github.com/${GITHUB_REPOSITORY}/releases/download/\$V/${NAME}.tar.gz"
          sha256sum -c <(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/\$V/checksums.txt")
          tar xzf "${NAME}.tar.gz"
          install -m755 html-render /usr/local/bin/html-render
          \`\`\`

          Not a browser: renders JS-free HTML/CSS to PNG.

          Measured by a probe in this repo, not quoted from a private deck:
          \`tools/bench.py\` renders a seeded eight-slide deck through both
          engines on a GitHub runner and writes \`bench/results.json\`, which is
          committed unedited. Against headless Chromium, peak process-tree RSS
          is **at least 31x** smaller: 75.5 MiB against 2350.8 MiB for
          \`--clip\`, 47.4 MiB for \`--clip --per-element\`, 37.6 MiB for
          \`--full\`. Wall clock is measured and drift-gated but not advertised,
          because the browser's own wall moves 18-22% between runs and a ratio
          would mostly report how fast the browser happened to be that day.
          4.7083% of pixels differ by more than 16 levels (glyph rasterisation and
          antialiasing; how much is layout is not quantified). On one host, same
          font stack, renderer version and band budget, three renders of the same input are byte-identical.
          Reproduce it:
          \`python3 tools/bench.py --bin <render> --chrome <chrome>\`.
          EOF
          )
          # Idempotent on purpose: a re-dispatch on a published tag must REPLACE
          # the asset, not die. `gh release create` refuses an existing release,
          # which is why tag v0.3.0-beta.4-r1 ran success/failure/success.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $VERSION exists: replacing assets"
            gh release upload "$VERSION" \
              "dist/${NAME}.tar.gz" dist/checksums.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" \
              "dist/${NAME}.tar.gz" \
              dist/checksums.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --notes "$NOTES" \
              --verify-tag
          fi

      - name: Verify the published asset
        # A release is a claim that this URL serves the binary we built. Download
        # it back over HTTPS and prove it: checksum against the published
        # checksums.txt, byte-compare with the build, then run it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          NAME='${{ steps.pkg.outputs.name }}'
          SIZE='${{ steps.pkg.outputs.size }}'
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION"
          rm -rf verify && mkdir verify && cd verify
          curl -fsSL -O "$BASE/${NAME}.tar.gz"
          curl -fsSL -O "$BASE/checksums.txt"
          sha256sum -c checksums.txt
          tar xzf "${NAME}.tar.gz"
          BUILT=$(md5sum "../dist/html-render" | cut -d' ' -f1)
          FETCHED=$(md5sum html-render | cut -d' ' -f1)
          echo "built:   $BUILT"
          echo "fetched: $FETCHED"
          [ "$BUILT" = "$FETCHED" ] || { echo "::error::published asset differs from the build"; exit 1; }
          # `--help` exits 0, but it proves only that the binary loads; the render
          # below is what proves the build. The `--help` line is a cheap smoke check, which
          # `pipefail` would turn into a failed step. The render below is the
          # real liveness check, so tolerate the usage exit.
          ./html-render --help 2>&1 | head -3 || true
          printf '<html><body style="margin:0"><div style="width:20px;height:10px;background:#f00"></div></body></html>' > t.html
          ./html-render t.html t.png 20 10 1 --document
          # Assert the IHDR dimensions, not a file-size floor: a 20x10 solid
          # colour legitimately compresses to 93 bytes.
          python3 -c "import struct;d=open('t.png','rb').read();assert d[:8]==b'\x89PNG\r\n\x1a\n','not a PNG';w,h=struct.unpack('>II',d[16:24]);assert (w,h)==(20,10),(w,h);print('renders: ok',w,'x',h,len(d),'bytes')"
          # Provenance, not just corruption. `sha256sum -c` above proves the file
          # arrived intact; this proves which commit and workflow produced it,
          # by checking the Sigstore bundle against GitHub's OIDC issuer. It
          # runs on the DOWNLOADED file, so a release published without an
          # attestation fails here rather than shipping silently.
          gh attestation verify "${NAME}.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh attestation verify checksums.txt --repo "$GITHUB_REPOSITORY"
