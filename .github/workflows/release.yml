name: release

# Publishes the Blitz renderer as a GitHub Release asset, so the deck pipeline
# installs from a versioned URL with a checksum instead of a CI artifact that
# expires and cannot be verified by anyone else.
#
#   curl -fsSL -O https://github.com/leshchenko1979/html-render/releases/download/vX/html-render_X_linux_amd64.tar.gz
#
# Triggered by a version tag only: the artifact is a binary, and a binary that
# silently changes under a fixed URL is not pinnable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist; the build is taken from this tag)"
        required: true

# Serialised, NOT cancelled: a publish half-way through replacing an asset is
# worse than waiting for the one ahead of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create

jobs:
  release:
    # NOT ubuntu-latest: the runner image's glibc becomes the binary's floor.
    # Pinning to 22.04 keeps it at 2.35; the guard below fails the build if
    # anything drags it back up.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A dispatch names a tag, and the asset must be built from THAT tag's
          # source: building the dispatched ref while `--verify-tag` merely checks
          # the tag exists publishes a binary that does not match its own tag.
          # On a tag push `github.ref` is already the tag, so this is a no-op.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build the Blitz renderer
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tail -60

      - name: Assert the glibc floor
        # A floor is only real if something checks it. A symbol above 2.35 means
        # the binary will not start on hosts we own, so fail here, not at runtime
        # on the box that needs it.
        run: |
          set -euo pipefail
          MAX=$(objdump -T target/release/render \
                | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "required glibc floor: $MAX"
          if [ "$(printf '%s\n2.35\n' "$MAX" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::binary requires glibc $MAX, above the 2.35 floor"
            exit 1
          fi
          echo "ok: runs on glibc >= 2.35"

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          [ -n "$VERSION" ] || { echo "::error::no tag"; exit 1; }
          NAME="html-render_${VERSION#v}_linux_amd64"
          mkdir -p dist
          cp target/release/render dist/html-render
          chmod 755 dist/html-render
          tar -C dist -czf "dist/${NAME}.tar.gz" html-render
          # The tarball is what gets downloaded, so the checksum is of the tarball.
          ( cd dist && sha256sum "${NAME}.tar.gz" > checksums.txt )
          cat dist/checksums.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Read from the artefact rather than typed into the body: a hardcoded
          # size goes stale on the first dependency bump and nobody notices.
          echo "size=$(du -h dist/html-render | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          NAME='${{ steps.pkg.outputs.name }}'
          SIZE='${{ steps.pkg.outputs.size }}'
          NOTES=$(cat <<EOF
          Static Blitz renderer CLI, built from \`${{ github.sha }}\`.

          | | |
          |---|---|
          | Asset | \`${NAME}.tar.gz\` |
          | Binary | \`html-render\`, ${SIZE}, single file |
          | Runtime deps | 13 system libraries: glibc, libssl/libcrypto, freetype, fontconfig, expat, png, zlib, bz2, brotli |
          | glibc floor | 2.35 (asserted at build time) |
          | Built on | ubuntu-22.04 |
          | Blitz pin | see \`Cargo.toml\` at this tag |

          Install:

          \`\`\`bash
          V=${VERSION}
          curl -fsSL -O "https://github.com/${GITHUB_REPOSITORY}/releases/download/\$V/${NAME}.tar.gz"
          sha256sum -c <(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/\$V/checksums.txt")
          tar xzf "${NAME}.tar.gz"
          install -m755 html-render /usr/local/bin/html-render
          \`\`\`

          Not a browser: renders JS-free HTML/CSS to PNG.

          Measured on a 12-slide, 4 MB deck at 2560x1440: **5.37 s** against
          headless Chromium's 13.36 s (2.49x faster). The RSS figures published
          for that deck — 93.4 MiB against 858 MiB — are **largest single
          process**, not the process tree; measured on a deck in the repo,
          Chromium's tree peaks 5.7-6.2x above its largest process while
          html-render is one process, so the real memory gap is wider than the
          9.19x those two numbers give. 4.13% of pixels differ by more than 16
          levels (glyph antialiasing, not layout), and ten renders of the same
          input are byte-identical. Source of these figures: \`GATES.md\`.
          EOF
          )
          # Idempotent on purpose: a re-dispatch on a published tag must REPLACE
          # the asset, not die. `gh release create` refuses an existing release,
          # which is why tag v0.3.0-beta.4-r1 ran success/failure/success.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $VERSION exists: replacing assets"
            gh release upload "$VERSION" \
              "dist/${NAME}.tar.gz" dist/checksums.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" \
              "dist/${NAME}.tar.gz" \
              dist/checksums.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --notes "$NOTES" \
              --verify-tag
          fi

      - name: Verify the published asset
        # A release is a claim that this URL serves the binary we built. Download
        # it back over HTTPS and prove it: checksum against the published
        # checksums.txt, byte-compare with the build, then run it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          NAME='${{ steps.pkg.outputs.name }}'
          SIZE='${{ steps.pkg.outputs.size }}'
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION"
          rm -rf verify && mkdir verify && cd verify
          curl -fsSL -O "$BASE/${NAME}.tar.gz"
          curl -fsSL -O "$BASE/checksums.txt"
          sha256sum -c checksums.txt
          tar xzf "${NAME}.tar.gz"
          BUILT=$(md5sum "../dist/html-render" | cut -d' ' -f1)
          FETCHED=$(md5sum html-render | cut -d' ' -f1)
          echo "built:   $BUILT"
          echo "fetched: $FETCHED"
          [ "$BUILT" = "$FETCHED" ] || { echo "::error::published asset differs from the build"; exit 1; }
          # `--help` is not a flag: the CLI prints usage and exits 2, which
          # `pipefail` would turn into a failed step. The render below is the
          # real liveness check, so tolerate the usage exit.
          ./html-render --help 2>&1 | head -3 || true
          printf '<html><body style="margin:0"><div style="width:20px;height:10px;background:#f00"></div></body></html>' > t.html
          ./html-render t.html t.png 20 10 1 --document
          # Assert the IHDR dimensions, not a file-size floor: a 20x10 solid
          # colour legitimately compresses to 93 bytes.
          python3 -c "import struct;d=open('t.png','rb').read();assert d[:8]==b'\x89PNG\r\n\x1a\n','not a PNG';w,h=struct.unpack('>II',d[16:24]);assert (w,h)==(20,10),(w,h);print('renders: ok',w,'x',h,len(d),'bytes')"
