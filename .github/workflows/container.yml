name: container

# Builds the image and proves it can render, on the same tag push that publishes
# the tarball. Two artifacts, one source: a user who pulls `ghcr.io/...:v0.3.0`
# gets the same commit the release asset was built from.
#
# The smoke test is the point. An image that builds is not an image that renders:
# a missing font or one of the 13 libraries produces a container that starts and
# then either fails at load time or silently substitutes a typeface.
on:
  push:
    tags: ["v*"]
    # `latest` is documented as tracking the default branch, so the workflow has
    # to RUN on the default branch — an `enable=` expression on a trigger that
    # never fires there is dead config. The paths filter keeps it to commits that
    # can actually move the image: a README edit must not pay a 326-crate Docker
    # build.
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "assets/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: container-${{ github.ref }}
  # A half-pushed image manifest is worse than waiting for the run ahead of it.
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        # `latest` only on a tag push, never on main: an image that silently
        # changes under a fixed name is not pinnable, the same reason the
        # release workflow is tag-triggered.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            # `latest` must exist for the README's one-line recipe to work: it
            # is the only name a reader can type without knowing a tag. It
            # tracks the default branch and every release, so it MOVES — pin a
            # digest or a version tag for anything reproducible.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # A dispatch has no tag, so `type=ref,event=tag` yields nothing and
            # the metadata step warns that no tag was generated. A sha tag is
            # enough to build, prove and push a testable image from main.
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: html-render:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the library closure is complete
        # `not found` is the failure this catches: a library present in the
        # builder but absent from the runtime image still lets the image build.
        run: |
          set -euo pipefail
          out=$(docker run --rm --entrypoint ldd html-render:test /usr/local/bin/html-render)
          echo "$out"
          missing=$(echo "$out" | grep -c 'not found' || true)
          libs=$(echo "$out" | grep -c '=>' || true)
          echo "libraries resolved: $libs, missing: $missing"
          test "$missing" -eq 0 || { echo "::error::$missing libraries not found"; exit 1; }
          # The CONTRACT is `missing == 0`: a library present in the builder but
          # absent from the runtime image still lets the image build, and only
          # ldd inside the runtime tells you.
          #
          # The count is a FLOOR, never an equality. An exact 13 was asserted
          # here and failed a perfectly good image with 12: the same source
          # yields a different closure per distro, because bookworm's freetype
          # does not link libbz2 while the runner's jammy build does. A gate
          # pinned to one distro's transitive graph reports a defect every time
          # the base image is rebuilt.
          #
          # 2 is the signature of the stub binary: `fn main() { println!() }`
          # links libc and libgcc_s and nothing else. A mtime-preserving COPY
          # over a layer that already compiled a stub makes cargo skip the real
          # build, so the floor is what tells the two apart. Real builds land at
          # 12-13; the stub at 2.
          test "$libs" -ge 10 || {
            echo "::error::expected at least 10 libraries, got $libs"
            echo "2 means the image carries the build stub, not the renderer"
            exit 1
          }

      - name: Assert the font is the one the assets name
        # A silent substitution re-wraps every line of text while the PNG still
        # looks plausible, which is the failure class this repo keeps hitting.
        run: |
          set -euo pipefail
          fc=$(docker run --rm --entrypoint fc-match html-render:test "DejaVu Sans")
          echo "fc-match: $fc"
          case "$fc" in
            *DejaVuSans*) echo "ok: DejaVu Sans is present" ;;
            *) echo "::error::DejaVu Sans is absent, fc-match resolved $fc"; exit 1 ;;
          esac

      - name: Render a shipped asset inside the container
        # Dimensions and ink, not byte-identity: the committed og.png was
        # rendered on the CI runner, and freetype's antialiasing moves between
        # library builds, so demanding identical bytes would fail for a reason
        # that is not a defect. What this leg DOES catch is the two failures that
        # matter: a library missing at load time (no PNG at all) and a canvas
        # with no glyphs on it (a substituted face that renders nothing).
        # `--user` is not a CI convenience, it is the documented recipe. The
        # image runs as uid 10001, so writing into a bind mount owned by the
        # caller fails with EACCES (exit 101, "create png: Permission denied") —
        # measured here, on the exact command the README tells users to run.
        # Passing the caller's uid:gid makes the output file belong to them,
        # which is what anyone mounting a directory expects.
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/assets:/work:ro" -v "$PWD/out:/out" \
            html-render:test /work/og.html /out/og.png 1280 640 2
          test -s out/og.png || { echo "::error::no PNG written"; exit 1; }
          echo "output owned by: $(stat -c '%u:%g' out/og.png)"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import measure

          w, h, c, px = measure.read_png("out/og.png")
          print(f"container render: {w}x{h}, {c} channels, {len(px):,} bytes")
          if (w, h) != (2560, 1280):
              raise SystemExit(f"::error::want 2560x1280, got {w}x{h}")
          colours = {tuple(px[i:i + c]) for i in range(0, len(px), c * 7)}
          print(f"sampled distinct colours: {len(colours)}")
          if len(colours) < 100:
              raise SystemExit(
                  f"::error::only {len(colours)} colours: the canvas is empty or "
                  "the glyphs were never painted"
              )
          print("ok: 2560x1280 with glyphs painted")
          PY

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
