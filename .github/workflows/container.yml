name: container

# Builds the image and proves it can render, on the same tag push that publishes
# the tarball. Two artifacts, one source: a user who pulls `ghcr.io/...:v0.3.0`
# gets the same commit the release asset was built from.
#
# The smoke test is the point. An image that builds is not an image that renders:
# a missing font or one of the 13 libraries produces a container that starts and
# then either fails at load time or silently substitutes a typeface.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: container-${{ github.ref }}
  # A half-pushed image manifest is worse than waiting for the run ahead of it.
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        # `latest` only on a tag push, never on main: an image that silently
        # changes under a fixed name is not pinnable, the same reason the
        # release workflow is tag-triggered.
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: html-render:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the library closure is complete
        # `not found` is the failure this catches: a library present in the
        # builder but absent from the runtime image still lets the image build.
        run: |
          set -euo pipefail
          out=$(docker run --rm --entrypoint ldd html-render:test /usr/local/bin/html-render)
          echo "$out"
          missing=$(echo "$out" | grep -c 'not found' || true)
          libs=$(echo "$out" | grep -c '=>' || true)
          echo "libraries resolved: $libs, missing: $missing"
          test "$missing" -eq 0 || { echo "::error::$missing libraries not found"; exit 1; }
          test "$libs" -eq 13 || { echo "::error::expected 13 libraries, got $libs"; exit 1; }

      - name: Assert the font is the one the assets name
        # A silent substitution re-wraps every line of text while the PNG still
        # looks plausible, which is the failure class this repo keeps hitting.
        run: |
          set -euo pipefail
          fc=$(docker run --rm --entrypoint fc-match html-render:test "DejaVu Sans")
          echo "fc-match: $fc"
          case "$fc" in
            *DejaVuSans*) echo "ok: DejaVu Sans is present" ;;
            *) echo "::error::DejaVu Sans is absent, fc-match resolved $fc"; exit 1 ;;
          esac

      - name: Render a shipped asset inside the container
        # Dimensions and ink, not byte-identity: the committed og.png was
        # rendered on the CI runner, and freetype's antialiasing moves between
        # library builds, so demanding identical bytes would fail for a reason
        # that is not a defect. What this leg DOES catch is the two failures that
        # matter: a library missing at load time (no PNG at all) and a canvas
        # with no glyphs on it (a substituted face that renders nothing).
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "$PWD/assets:/work:ro" -v "$PWD/out:/out" \
            html-render:test /work/og.html /out/og.png 1280 640 2
          test -s out/og.png || { echo "::error::no PNG written"; exit 1; }
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import measure

          w, h, c, px = measure.read_png("out/og.png")
          print(f"container render: {w}x{h}, {c} channels, {len(px):,} bytes")
          if (w, h) != (2560, 1280):
              raise SystemExit(f"::error::want 2560x1280, got {w}x{h}")
          colours = {tuple(px[i:i + c]) for i in range(0, len(px), c * 7)}
          print(f"sampled distinct colours: {len(colours)}")
          if len(colours) < 100:
              raise SystemExit(
                  f"::error::only {len(colours)} colours: the canvas is empty or "
                  "the glyphs were never painted"
              )
          print("ok: 2560x1280 with glyphs painted")
          PY

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
