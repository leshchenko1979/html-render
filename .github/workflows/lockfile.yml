name: lockfile

# `Cargo.lock` is resolved by CI, never typed by hand: the ops host has no Rust
# toolchain, and a lockfile nobody resolved records nothing.
#
# Why it has to exist at all: `Cargo.toml` pins the five `blitz-*` crates, but
# `anyrender`, `anyrender_vello_cpu`, `peniko`, `png` and `tokio` are ranges. Two
# builds of one commit could resolve different versions of those five, which
# makes every number in GATES.md a property of a dependency graph the tree never
# recorded. It also blocks Dependabot's `cargo` ecosystem: the updater needs a
# lockfile to resolve against and fails without one.
#
# Triggers on `Cargo.toml` only, so the commit this job makes cannot re-trigger
# it: the lockfile it writes is an output, not an input.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:
    inputs:
      dispatch_only:
        description: "Run the dispatch step even if Cargo.lock did not move (self-test for #22)"
        type: boolean
        default: false

permissions:
  contents: write
  # The job ends by dispatching workflows, which is an API call and not a push:
  # without this the dispatch is refused. Scoped to this job's token.
  actions: write

# Serialised, not cancelled: two runs racing to commit one file would leave the
# loser's push rejected after it had already resolved a graph.
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Generate the lockfile
        # No --locked here: this step is what CREATES the file. The build jobs
        # use --locked, so a Cargo.toml that resolves to a different graph than
        # the committed lockfile fails there instead of silently re-resolving.
        run: cargo generate-lockfile

      - name: Assert it resolved something
        # A lockfile with no packages is the shape of a silent no-op.
        run: |
          test -f Cargo.lock || { echo "cargo generate-lockfile wrote nothing"; exit 1; }
          pkgs=$(grep -c '^name = ' Cargo.lock)
          echo "packages in Cargo.lock: $pkgs"
          test "$pkgs" -gt 20 || { echo "only $pkgs packages resolved"; exit 1; }

      - name: Commit it if it moved
        id: commit
        # No `[skip ci]`, and that is the whole point: a lockfile change can move
        # the resolved graph, so the builds are the check that it did not move a
        # pixel. But a push made with `GITHUB_TOKEN` starts NO workflow (GitHub
        # suppresses the recursive trigger), so the builds do not follow on their
        # own — the next step dispatches them. Without it this commit landed with
        # nothing building it and the job still read green (#22).
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            if git diff --quiet -- Cargo.lock; then
              echo "Cargo.lock unchanged: the committed graph is what Cargo.toml resolves to"
              echo "moved=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): resolve Cargo.lock from Cargo.toml"
          git push
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch the builds the push cannot start
        # `dispatch_only` exists because the interesting branch is otherwise
        # reachable only when Cargo.toml happens to resolve differently: a fix
        # whose happy path has never run is the thing this issue is about. A
        # manual run with the input set proves the dispatch and the read-back
        # against whatever is on the ref right now.
        if: steps.commit.outputs.moved == 'true' || github.event.inputs.dispatch_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh workflow run` creates the run through the API, so it is NOT
        # suppressed the way a `GITHUB_TOKEN` push is.
        #
        # Both workflows, not just parity: `Cargo.lock` is a path trigger for
        # each, and one suppression skipped both. On v0.3.0-beta.8 a re-resolved
        # lock left `container` building the stale graph while this job reported
        # success, and neither run existed until it was dispatched by hand.
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          for wf in parity.yml container.yml; do
            echo "dispatching $wf for $sha"
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          done

          # A dispatch names a REF, not a commit, so it verifies that ref's HEAD —
          # which is this commit only if nothing landed in between. Read back
          # by sha instead of trusting the dispatch: a check pointed at the wrong
          # tree is this issue's defect wearing a green tick.
          for wf in parity.yml container.yml; do
            found=""
            for _ in $(seq 1 30); do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$sha" \
                    --jq '.total_count')
              if [ "$n" -gt 0 ]; then found=yes; break; fi
              sleep 3
            done
            test -n "$found" || {
              echo "::error::$wf has no run for $sha: the lockfile commit is unverified"
              exit 1
            }
            echo "$wf: run queued for $sha"
          done
