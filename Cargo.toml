[package]
name = "html-render"
version = "0.3.0-beta.6"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Render HTML+CSS to PNG with no browser, via Blitz (Stylo + Taffy + Vello)"

[[bin]]
name = "render"
path = "src/main.rs"

# Pinned to one Blitz release: the API is pre-1.0 and moves between betas, so an
# unpinned build would silently measure a different engine than the one recorded.
[dependencies]
blitz-html = "=0.3.0-beta.4"
blitz-dom = "=0.3.0-beta.4"
blitz-net = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"
png = "0.18"
# Needed because blitz-net spawns a tokio task per sub-resource fetch.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3
