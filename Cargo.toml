[package]
name = "html-render"
version = "0.3.0-beta.7"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Render HTML+CSS to PNG with no browser, via Blitz (Stylo + Taffy + Vello)"

[[bin]]
name = "render"
path = "src/main.rs"

# Pinned to one Blitz release: the API is pre-1.0 and moves between betas, so an
# unpinned build would silently measure a different engine than the one recorded.
[dependencies]
blitz-html = "=0.3.0-beta.4"
blitz-dom = "=0.3.0-beta.4"
blitz-net = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"
png = "0.18"
# Named directly for one comparison: `Node::taffy_position()` returns
# `taffy::Position`, and blitz-dom's own paint tree compares it the same way
# (`paint_tree.rs:42`). A typed compare means an upstream rename is a compile
# error, not a silent false.
#
# `default-features = false` is load-bearing, not tidiness. taffy's `default`
# set includes `float_layout`, and cargo unions features across the whole graph,
# so a plain `taffy = "0.15"` switches `float_layout` on for everyone while
# `stylo_taffy/floats` stays off. `taffy::Style` then gains `clear` and `float`
# and stylo_taffy's initializer (convert.rs:966) dies with E0063 — a build
# failure in a dependency, before this crate's own code is even reached.
# Requesting no features leaves blitz-dom's own list as the sole contributor.
taffy = { version = "0.15", default-features = false }
# Needed because blitz-net spawns a tokio task per sub-resource fetch.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3
